name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
        # 1. 소스 체크아웃
      - name: Checkout source
        uses: actions/checkout@v4

        # 2. JDK 설치
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

        # 3. Gradle 의존성 캐시
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

        # 4. 테스트 (Testcontainers 가 러너의 Docker 로 MySQL 을 띄운다. 비밀값은 쓰지 않는다)
      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Test with Gradle
        run: ./gradlew test

        # 5. 실패하면 테스트 보고서를 남긴다
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
